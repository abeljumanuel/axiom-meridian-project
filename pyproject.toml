[build-system]
requires = ["hatchling>=1.27"]  # PEP 639: license-files (1.26) + core metadata 2.4 by default (1.27)
build-backend = "hatchling.build"

[project]
name = "axiom-meridian"
dynamic = ["version"]  # single source: src/meridian/__init__.py
description = "Knowledge audit MCP server — Code drifts. Meridian doesn't."
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression (PEP 639). No `License ::` classifiers: PEP 639 deprecates
# them alongside a license expression.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Juan Manuel Rojas González" }, { name = "Axiom JUMA" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "knowledge-base",
    "code-review",
    "coding-standards",
    "lessons-learned",
    "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/abeljumanuel/axiom-meridian-project"
Repository = "https://github.com/abeljumanuel/axiom-meridian-project"
Issues = "https://github.com/abeljumanuel/axiom-meridian-project/issues"

[project.scripts]
meridian = "meridian.__main__:main"
meridian-mcp = "meridian.server:run_stdio"

[tool.hatch.version]
path = "src/meridian/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

# Explicit allowlist: without it the sdist would ship everything not
# gitignored (.claude/, .atl/, changes/, openspec/, docs/...) to PyPI.
[tool.hatch.build.targets.sdist]
include = ["/src/meridian", "/tests", "/README.md", "/pyproject.toml", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "benchmark: performance regression guards (excluded from the default run; invoke explicitly with `-m benchmark`)",
]
addopts = "-m 'not benchmark'"

[tool.ruff]
target-version = "py311"
line-length = 100
